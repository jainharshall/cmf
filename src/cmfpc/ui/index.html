<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>cmfpc</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#000;--card:#1c1c1c;--btn:#2d2d2d;--fg:#f2f2f2;--mute:#8c8c8c;--red:#ee2229}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,Segoe UI,sans-serif;padding:20px}
h1,h2{font-family:Georgia,serif;font-weight:400;margin:0}
h1{font-size:30px}h2{font-size:26px;text-align:center;margin:28px 0 18px}
h3{margin:0;font-weight:500;font-size:19px}
.hidden{display:none}.mute{color:var(--mute);margin:4px 0 0}
header{display:flex;justify-content:space-between;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:#555}.dot.on{background:#1db954}
.status{color:var(--mute);min-height:20px;margin-top:8px;font-size:13px}
.bat{display:flex;justify-content:center;gap:40px;margin-bottom:24px}
.bat div{width:110px;text-align:center}
.bat i{display:block;height:3px;background:#333;border-radius:2px;margin-bottom:8px;position:relative;overflow:hidden}
.bat i b{position:absolute;left:0;top:0;bottom:0;background:#fff;width:0}
.card{background:var(--card);border-radius:26px;padding:22px;margin-bottom:12px}
.modes{display:flex;justify-content:space-around;margin-top:20px}
.modes button{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;cursor:pointer;width:96px}
.circ{width:64px;height:64px;border-radius:50%;background:var(--btn);display:grid;place-items:center;margin:0 auto 8px;color:#fff}
.modes .on{color:#fff}.modes .on .circ{background:#f2f2f2;color:#111}
svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:24px;padding:18px;min-height:130px;text-align:left;color:var(--fg);border:0;font:inherit;display:flex;flex-direction:column;justify-content:space-between}
.tile small{color:var(--mute);display:block;margin-top:4px}
.tile.off{opacity:.45}.tile:not(.off){cursor:pointer}
.back{background:none;border:0;color:#fff;font-size:28px;cursor:pointer;padding:0}
.banner{background:#2a1a1a;border:1px solid #4a2326;color:#e9a3a6;border-radius:14px;padding:10px 14px;font-size:13px;margin:14px 0}
#eqsvg{width:100%;max-width:340px;display:block;margin:0 auto;touch-action:none}
.vals{display:flex;justify-content:space-around;font-family:monospace;color:var(--mute);margin:10px 0 18px}
.vals .nz{color:var(--red)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pills button{background:var(--card);color:var(--mute);border:0;border-radius:30px;padding:16px;letter-spacing:.1em;font-size:12px}
.pills .act{background:var(--red);color:#fff}.pills .wide{grid-column:1/3}
.sw{width:52px;height:30px;border-radius:16px;background:#555;position:relative;border:0;padding:0;display:block;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#111;transition:.15s}
.sw.on{background:#f2f2f2}.sw.on::after{left:25px}
.tile>.sw{margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.lv{display:flex;gap:5px}.lv i{width:6px;height:20px;border-radius:2px;background:#444;cursor:pointer}.lv i.on{background:var(--red)}
</style></head><body>

<div id="main">
  <header><h1>My devices</h1><span id="dot" class="dot"></span></header>
  <div id="status" class="status">Connecting…</div>
  <h2>CMF Buds 2</h2>
  <div class="bat">
    <div><i><b id="bl"></b></i><span id="tl">L –</span></div>
    <div><i><b id="br"></b></i><span id="tr">R –</span></div>
  </div>

  <section class="card">
    <h3>Noise Cancellation</h3><p id="modeLabel" class="mute">–</p>
    <div class="modes">
      <button data-mode="anc"><div class="circ"><svg class="ic" viewBox="0 0 24 24"><path d="M5.5 15a7 7 0 1 1 13 0"/><circle cx="12" cy="13" r="1.4"/></svg></div>Noise Cancellation</button>
      <button data-mode="transparency"><div class="circ"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" stroke-dasharray="0.1 3.6"/><circle cx="12" cy="12" r="1.4"/></svg></div>Transparency</button>
      <button data-mode="off"><div class="circ"><svg class="ic" viewBox="0 0 24 24"><path d="M5.5 15a7 7 0 1 1 13 0"/><path d="M5 5l14 14"/></svg></div>Off</button>
    </div>
  </section>

  <div class="grid">
    <button class="tile" id="openEq"><div>Equaliser<small id="eqSub">–</small></div></button>
    <div class="tile"><div>Ultra Bass<small id="bassSub">–</small></div>
      <div class="row"><button class="sw" id="bassSw"></button><div class="lv" id="bassLv"><i></i><i></i><i></i><i></i><i></i></div></div></div>
    <button class="tile" id="tSpatial"><div>Spatial Audio<small id="spSub">–</small></div><span class="sw" id="spSw"></span></button>
    <button class="tile" id="tLat"><div>Low Lag Mode<small id="latSub">–</small></div><span class="sw" id="latSw"></span></button>
    <button class="tile" id="tEar"><div>In-ear detection<small id="earSub">–</small></div><span class="sw" id="earSw"></span></button>
    <div class="tile off"><div>Dual Connection<small>Coming soon</small></div></div>
    <div class="tile off"><div>Controls<small>Coming soon</small></div></div>
  </div>
</div>

<div id="eq" class="hidden">
  <button class="back" id="back">←</button>
  <h1 style="margin-top:14px">Equaliser</h1>
  <div class="banner">Presets work. The circle (custom EQ) is a preview and not connected yet.</div>
  <svg id="eqsvg" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="190" fill="#1d1d1d"/>
    <circle cx="200" cy="200" r="85" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <polygon id="blob" fill="rgba(238,34,41,.15)" stroke="rgba(238,34,41,.5)" stroke-width="2"/>
    <circle cx="200" cy="200" r="12" fill="#000"/>
  </svg>
  <div class="vals"><span id="vb">Bass 0</span><span id="vm">Mid 0</span><span id="vt">Treble 0</span></div>
  <div class="pills">
    <button data-eq="dirac">DIRAC OPTEO</button><button data-eq="pop">POP</button>
    <button data-eq="rock">ROCK</button><button data-eq="classical">CLASSICAL</button>
    <button data-eq="electronic">ELECTRONIC</button><button data-eq="vocals">ENHANCE VOCALS</button>
    <button data-eq="custom" class="wide">CUSTOM</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const NAMES={anc:"Noise Cancellation",transparency:"Transparency",off:"Off"};

function render(s){
  $('#dot').classList.toggle('on',!!s.connected);
  $('#status').textContent=s.connected?'':(s.error||'Not connected');
  if(!s.connected){loaded=false;return}
  if(!loaded){loaded=true;loadSettings()}
  const b=s.battery||{};
  for(const [k,id] of [['left','l'],['right','r']]){
    const v=b[k];
    $('#b'+id).style.width=v?v.level+'%':'0';
    $('#t'+id).textContent=k[0].toUpperCase()+' '+(v?v.level+'%'+(v.charging?' +':''):'–');
  }
  $('#modeLabel').textContent=NAMES[s.mode]||s.mode||'–';
  document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x.dataset.mode===s.mode));
}
async function poll(){try{render(await pywebview.api.state())}catch(e){}}
document.querySelectorAll('.modes button').forEach(btn=>btn.onclick=async()=>{
  const m=btn.dataset.mode;
  document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===btn));
  $('#modeLabel').textContent=NAMES[m];
  await pywebview.api.set_anc(m);
});
window.addEventListener('pywebviewready',()=>{poll();setInterval(poll,5000)});

let loaded=false,S={};
const sw=(id,on)=>$('#'+id).classList.toggle('on',!!on);
const EQN={dirac:'Dirac Opteo',pop:'Pop',rock:'Rock',classical:'Classical',electronic:'Electronic',vocals:'Enhance Vocals',custom:'Custom'};
function renderSettings(s){
  if(!s)return;S=s;const b=s.bass||{};
  sw('bassSw',b.enabled);$('#bassSub').textContent=b.enabled?'On · Level '+b.level:'Off';
  document.querySelectorAll('#bassLv i').forEach((e,i)=>e.classList.toggle('on',b.enabled&&i<b.level));
  const sp=s.spatial==='fixed';sw('spSw',sp);$('#spSub').textContent=sp?'Fixed':'Off';
  sw('latSw',s.latency);$('#latSub').textContent=s.latency?'On':'Off';
  sw('earSw',s.inear);$('#earSub').textContent=s.inear?'On':'Off';
  $('#eqSub').textContent=EQN[s.eq]||s.eq||'–';
  document.querySelectorAll('.pills button').forEach(p=>p.classList.toggle('act',p.dataset.eq===s.eq));
}
async function loadSettings(){try{renderSettings(await pywebview.api.settings())}catch(e){}}
async function setF(n,v){try{renderSettings(await pywebview.api.set_feature(n,v))}catch(e){}}
$('#bassSw').onclick=()=>S.bass&&setF('bass',{enabled:!S.bass.enabled,level:S.bass.level||3});
document.querySelectorAll('#bassLv i').forEach((e,i)=>e.onclick=()=>setF('bass',{enabled:true,level:i+1}));
$('#tSpatial').onclick=()=>setF('spatial',S.spatial==='fixed'?'off':'fixed');
$('#tLat').onclick=()=>setF('latency',!S.latency);
$('#tEar').onclick=()=>setF('inear',!S.inear);
document.querySelectorAll('.pills button').forEach(p=>p.onclick=()=>setF('eq',p.dataset.eq));

/* Equaliser preview */
$('#openEq').onclick=()=>{$('#main').classList.add('hidden');$('#eq').classList.remove('hidden')};
$('#back').onclick=()=>{$('#eq').classList.add('hidden');$('#main').classList.remove('hidden')};
const AX={mid:-90,treble:30,bass:150},BASE=85,K=12,MAX=6,NS='http://www.w3.org/2000/svg';
const val={bass:0,mid:0,treble:0},H={},svg=$('#eqsvg');let drag=null;
const pos=k=>{const a=AX[k]*Math.PI/180,r=BASE+val[k]*K;return[200+r*Math.cos(a),200+r*Math.sin(a)]};
for(const k of Object.keys(AX)){
  const c=document.createElementNS(NS,'circle');c.setAttribute('r',15);c.style.cursor='grab';
  c.addEventListener('pointerdown',e=>{drag=k;e.preventDefault()});svg.appendChild(c);H[k]=c;
}
function draw(){
  const pts=[];
  for(const k in H){const[x,y]=pos(k);H[k].setAttribute('cx',x);H[k].setAttribute('cy',y);
    H[k].setAttribute('fill',val[k]?'#ee2229':'#f2f2f2');pts.push(x+','+y)}
  $('#blob').setAttribute('points',pts.join(' '));
  for(const [k,id,n] of [['bass','vb','Bass'],['mid','vm','Mid'],['treble','vt','Treble']]){
    const e=$('#'+id);e.textContent=n+' '+(val[k]>0?'+':'')+val[k];e.classList.toggle('nz',!!val[k]);
  }
}
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*400-200,y=(e.clientY-r.top)/r.height*400-200;
  const a=AX[drag]*Math.PI/180,proj=x*Math.cos(a)+y*Math.sin(a);
  val[drag]=Math.max(-MAX,Math.min(MAX,Math.round((proj-BASE)/K)));draw();
});
window.addEventListener('pointerup',()=>drag=null);
draw();
</script></body></html>
